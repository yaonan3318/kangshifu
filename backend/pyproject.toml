[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "company-search-backend"
version = "0.1.0"
description = "Mac-local managed document library"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.13,<2",
  "chardet>=5.2,<6",
  "fastapi>=0.115,<1",
  "jieba>=0.42,<1",
  "openpyxl>=3.1,<4",
  "pillow>=11,<13",
  "pgvector>=0.3,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pytesseract>=0.3.13,<1",
  "python-docx>=1.1,<2",
  "python-magic>=0.4.27,<1",
  "python-multipart>=0.0.12,<1",
  "python-pptx>=1.0,<2",
  "sentence-transformers>=3.3,<6",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
