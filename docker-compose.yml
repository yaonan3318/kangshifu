services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: company_search
      POSTGRES_USER: company_search
      POSTGRES_PASSWORD: company_search
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - company_search_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company_search -d company_search"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  company_search_postgres:

